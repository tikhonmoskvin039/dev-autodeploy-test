name: Build and Deploy via GHCR

on:
  push:
    branches: ["dev"]

jobs:
  # 1️⃣ Билдим Docker-образ в облаке
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # Логин в GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Сборка и пуш
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/myapp:dev

  # 2️⃣ Деплой на self-hosted ВМ
  deploy:
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Log in to GHCR
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull and restart container
        run: |
          docker pull ghcr.io/${{ github.repository }}/myapp:dev
          docker stop myapp || true
          docker rm myapp || true
          docker run -d --name myapp -p 80:80 ghcr.io/${{ github.repository }}/myapp:dev

      - name: Log deploy
        run: echo "✅ Deploy completed at $(date)"
